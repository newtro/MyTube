[project]
name = "mytube"
version = "0.1.0"
description = "Personal YouTube client with a self-owned recommendation engine"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "numpy>=2.1",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "google-api-python-client>=2.187.0",
    "google-auth>=2.35",
    "google-auth-oauthlib>=1.2",
    "fastapi>=0.141.0,<0.142",
    "uvicorn>=0.32",
    "apscheduler>=3.11,<4",
    "cryptography>=43",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
mytube = "mytube.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mytube"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
